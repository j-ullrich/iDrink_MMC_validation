# Conda environment for the iDrink MMC validation pipeline.
#
#   conda env create -f environment.yml
#
# Direct dependencies only, pinned to the versions of the working Windows setup (legacy_envs/env2.yml).
# Assumes an NVIDIA GPU with CUDA 12.1. For a CPU-only machine replace the torch/torchvision lines by the
# CPU wheels (index https://download.pytorch.org/whl/cpu) and drop onnxruntime-gpu for onnxruntime.
name: idrink
channels:
  - opensim-org
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - opensim=4.5
  - pillow
  - toml
  - lxml
  - pyyaml
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      # core data handling and plotting
      - numpy==1.26.0
      - pandas==1.5.3
      - scipy==1.13.1
      - matplotlib==3.9.0
      - plotly==5.22.0
      - statsmodels==0.14.2
      - openpyxl==3.1.2
      - tqdm==4.65.2
      - fuzzywuzzy
      - trc-data-reader==0.3.4
      # pose estimation: Metrabs (PyTorch) and MMPose
      - torch==2.1.0+cu121
      - torchvision==0.16.0+cu121
      - einops==0.8.0
      - simplepyutils==0.1.2
      - hydra-core==1.3.2
      - attrdict==2.0.1
      - more-itertools==10.4.0
      - ultralytics==8.2.79
      - opencv-python==4.10.0.84
      - imageio==2.34.2
      - mmengine==0.10.4
      - mmcv==2.1.0
      - mmdet==3.2.0
      - mmpose==1.3.1
      # Pose2Sim (vendored in src/Pose2Sim)
      - aniposelib==0.6.1
      - anytree==2.12.1
      - c3d==0.5.2
      - filterpy==1.4.5
      - mpl-interactions==0.24.1
      - pyqt6==6.7.0
      - rtmlib==0.0.12
      - onnxruntime-gpu==1.18.0
      # legacy TensorFlow variant of the Metrabs wrappers (metrabsPose*_TF.py) and marker augmentation
      - tensorflow==2.17.0
      - tensorflow-hub==0.16.1
      - tensorflow-io==0.31.0
      # this repository
      - -e .
