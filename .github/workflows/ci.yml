name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install light dependencies
        # The heavy dependencies (torch, opensim, mmpose, ...) are stubbed by the tests.
        run: pip install pytest pandas numpy toml pyflakes pyyaml
      - name: Tests
        run: python -m pytest -q
      - name: Undefined names in the refactored modules
        run: |
          out=$(python -m pyflakes src/iDrinkHubValidation.py src/iDrink/iDrinkConfig.py src/iDrink/iDrinkPipeline.py \
            src/iDrink/iDrinkParallel.py src/iDrink/stats src/iDrink/plots | grep "undefined name" || true)
          echo "$out"
          # run_statistics in the hub still refers to names it never defines (known, see README). Nothing else may.
          test -z "$(echo "$out" | grep -v 'src/iDrinkHubValidation.py')"
